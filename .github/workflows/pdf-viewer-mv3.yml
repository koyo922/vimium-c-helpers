name: PDF viewer MV3 bridge
on:
  push:
    paths: ['pdf-viewer/mv3/**', '.github/workflows/pdf-viewer-mv3.yml']
  pull_request:
    paths: ['pdf-viewer/mv3/**', '.github/workflows/pdf-viewer-mv3.yml']
permissions:
  contents: read
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s pdf-viewer/mv3/tests -v
